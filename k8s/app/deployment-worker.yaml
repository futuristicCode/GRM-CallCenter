apiVersion: apps/v1
kind: Deployment
metadata:
  name: grm-worker
  namespace: grm
  labels:
    app.kubernetes.io/name: grm
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grm
      app.kubernetes.io/component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grm
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: dssi04/grm-app:latest
          imagePullPolicy: IfNotPresent
          command:
            - php
            - /var/www/html/artisan
            - queue:work
            - --sleep=3
            - --tries=3
            - --max-time=3600
            - --queue=default
          envFrom:
            - configMapRef:
                name: grm-config
            - secretRef:
                name: grm-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
            - name: bootstrap-cache
              mountPath: /var/www/html/bootstrap/cache
      volumes:
        - name: storage
          emptyDir: {}
        - name: bootstrap-cache
          emptyDir:
            medium: Memory
      terminationGracePeriodSeconds: 60
