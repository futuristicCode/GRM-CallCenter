apiVersion: apps/v1
kind: Deployment
metadata:
  name: grm-scheduler
  namespace: grm
  labels:
    app.kubernetes.io/name: grm
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grm
      app.kubernetes.io/component: scheduler
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grm
        app.kubernetes.io/component: scheduler
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: scheduler
          image: dssi04/grm-app:latest
          imagePullPolicy: IfNotPresent
          command:
            - php
            - /var/www/html/artisan
            - schedule:work
          envFrom:
            - configMapRef:
                name: grm-config
            - secretRef:
                name: grm-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
            - name: bootstrap-cache
              mountPath: /var/www/html/bootstrap/cache
      volumes:
        - name: storage
          emptyDir: {}
        - name: bootstrap-cache
          emptyDir:
            medium: Memory
      terminationGracePeriodSeconds: 30
